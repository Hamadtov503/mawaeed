name: Build Mawaeed IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Mawaeed.xcodeproj -scheme Mawaeed -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee xcodebuild.log || {
              grep -E "error:|is not installed|does not contain|Unable to" xcodebuild.log | sort -u | head -25 | sed 's/^/::error::/'
              exit 1
            }

      - name: Package IPA for TrollStore
        run: |
          APP=build/Build/Products/Release-iphoneos/Mawaeed.app
          ldid -S "$APP/Mawaeed"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Mawaeed.ipa Payload
          ls -lh Mawaeed.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Mawaeed-ipa
          path: Mawaeed.ipa

      # A direct .ipa link that opens on the iPhone ("Open in TrollStore"). Beta builds until 1.0:
      # the release is a pre-release and the file name carries the build number.
      - name: Publish as the "latest" beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="Mawaeed-beta-${{ github.run_number }}.ipa"
          cp Mawaeed.ipa "$IPA"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$IPA" --target ${{ github.sha }} --prerelease \
            --title "مواعيدي 0.1 Beta — build ${{ github.run_number }}" --notes ""
