name: UI tests

# Manual only (Actions → UI tests → Run workflow): simulator runs use a lot of macOS minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a run still in progress (two runs publishing the same release clash).
concurrency:
  group: ui-tests
  cancel-in-progress: true

jobs:
  ui-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            ios: "18"
            tag: ui-tests
          # An older iOS too: phones on TrollStore run iOS 17 or earlier, and some SwiftUI layout
          # and hit-testing behaviour differs there.
          - os: macos-15
            ios: "17"
            tag: ui-tests-17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: RTL check (no iOS-drawn menus, dialogs or pickers)
        run: ./scripts/check-rtl.sh

      - name: Install tools
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Get the iOS ${{ matrix.ios }} simulator
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS ${{ matrix.ios }}\."; then
            xcodebuild -downloadPlatform iOS -buildVersion ${{ matrix.ios }}.5 || xcodebuild -downloadPlatform iOS -buildVersion ${{ matrix.ios }}.4 || true
          fi
          RT=$(xcrun simctl list runtimes | grep -oE "com.apple.CoreSimulator.SimRuntime.iOS-${{ matrix.ios }}-[0-9-]+" | tail -1)
          echo "runtime: $RT"
          if [ -n "$RT" ] && ! xcrun simctl list devices available | awk -v want="-- iOS ${{ matrix.ios }}." '/^-- / { on = index($0, want) == 1; next } on && /iPhone/ { f=1 } END { exit !f }'; then
            xcrun simctl create "iPhone 15 Pro" com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro "$RT"
          fi

      - name: Pick a simulator
        run: |
          xcrun simctl list runtimes
          # The first iPhone Pro listed under an "-- iOS <major>.x --" heading.
          UDID=$(xcrun simctl list devices available | awk -v want="-- iOS ${{ matrix.ios }}." '
            /^-- / { on = index($0, want) == 1; next }
            on && /iPhone 1[4-7] Pro \(/ { match($0, /[0-9A-F-]{36}/); print substr($0, RSTART, RLENGTH); exit }')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | awk -v want="-- iOS ${{ matrix.ios }}." '
              /^-- / { on = index($0, want) == 1; next }
              on && /iPhone/ { match($0, /[0-9A-F-]{36}/); print substr($0, RSTART, RLENGTH); exit }')
          fi
          echo "DEST=id=$UDID" >> $GITHUB_ENV
          echo "::notice::iOS ${{ matrix.ios }} simulator: $UDID"

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test -project Mawaeed.xcodeproj -scheme Mawaeed \
            -destination "$DEST" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "Test Case|error:|failed|passed|XCTAssert" || true
          if grep -q "TEST SUCCEEDED" test.log; then echo "RESULT=passed" >> $GITHUB_ENV; else echo "RESULT=failed" >> $GITHUB_ENV; fi

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path shots \
            || { brew install chargepoint/xcparse/xcparse && xcparse attachments TestResults.xcresult shots; } || true
          ls -la shots | head -60
          (cd shots && zip -qr ../ui-shots.zip .) || true
          grep -E "error:|failed|Test Case .* (passed|failed)" test.log > failures.txt || true
          tail -150 test.log > test-tail.log

      - name: Publish results as a pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ${{ matrix.tag }} --yes --cleanup-tag || true
          gh release create ${{ matrix.tag }} ui-shots.zip failures.txt test-tail.log --prerelease --target ${{ github.sha }} \
            --title "UI tests iOS ${{ matrix.ios }} — run ${{ github.run_number }} (${{ env.RESULT }})" \
            --notes "Automated simulator run: screenshots of each step and test results."

      - name: Fail if tests failed
        if: env.RESULT != 'passed'
        run: exit 1
