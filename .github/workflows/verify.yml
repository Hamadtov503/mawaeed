name: Verify iOS app
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check asset merge and persistence model
        run: |
          swiftc Sources/Model/Asset.swift Tests/AssetMergeChecks.swift -o /tmp/asset-checks
          /tmp/asset-checks
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Mawaeed.xcodeproj -scheme Mawaeed -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Capture welcome screen
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Mawaeed.app
          xcrun simctl launch "$DEVICE" com.hamad.mawaeed
          sleep 5
          xcrun simctl io "$DEVICE" screenshot welcome.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            build.log
            welcome.png

